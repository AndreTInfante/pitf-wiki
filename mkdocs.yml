site_name: PITF Wiki
site_description: Fan wiki for PITF (Paranatural Incident Task Force), a Monster of the Week actual-play campaign.
site_url: https://andretinfante.github.io/pitf-wiki/
repo_url: https://github.com/AndreTInfante/pitf-wiki
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

